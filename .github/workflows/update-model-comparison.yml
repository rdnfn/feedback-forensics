name: Update Model Personality Comparison Dataset

# Updates the model comparison dataset by running the
# model comparison tool for a given prompt set.
# This workflow will check if any new model has been added
# and the dataset needs to be updated accordingly.
#
# New models are generated via the OpenRouter batch API if available
# (cheaper, but may take up to 24h). Add suffix ':nonbatch' to a model
# to use the live API instead. Batches still pending at the end of
# a run are picked up by the next (manually triggered) run. Partial results
# of failed runs are saved to the 'wip' branch of the HF dataset and
# automatically reused by the next run.
#
# Annotation settings (annotator model, position debiasing) are fixed per
# dataset version: existing annotations are reused, so the run fails before any
# API call if they were created with other settings. To change the annotator,
# create a new version (VERSION_PATH) without annotations.

on:
  # allow manual triggering
  workflow_dispatch:

env:
  HF_DATASET: "rdnfn/ff-model-personality"
  VERSION_PATH: "data/v3"
  # Chosen by evaluation against the paper's human trait labels (used with
  # position debiasing, i.e. each comparison is annotated in both response
  # orders and only votes that agree are kept)
  ANNOTATOR_MODEL: openrouter/google/gemini-3.5-flash-lite
  # One model per line. Folded into a single space-separated string (env values
  # must be strings). No comments inside the list: they would become models.
  MODELS: >-
    openrouter/openai/gpt-4o-2024-11-20
    openrouter/openai/gpt-4.1-mini
    openrouter/x-ai/grok-4
    openrouter/google/gemini-2.5-pro
    openrouter/moonshotai/kimi-k2
    openrouter/meta-llama/llama-4-maverick
    openrouter/mistralai/magistral-medium-2506
    openrouter/anthropic/claude-sonnet-4
    openrouter/openai/gpt-oss-20b
    openrouter/openai/gpt-5
    openrouter/mistralai/mistral-medium-3.1
    openrouter/anthropic/claude-sonnet-4.5
    openrouter/z-ai/glm-4.6
    openrouter/anthropic/claude-haiku-4.5
    openrouter/google/gemini-3-pro-preview
    openrouter/openai/gpt-5.1
    openrouter/openai/gpt-5.1-chat
    openrouter/allenai/olmo-3-32b-think
    openrouter/allenai/olmo-3-7b-instruct
    openrouter/allenai/olmo-3-7b-think
    openrouter/mistralai/mistral-large-2512
    openrouter/google/gemini-3.1-pro-preview
    openrouter/mistralai/mistral-medium-3-5
    openrouter/anthropic/claude-opus-4.7
    openrouter/openai/gpt-5.3-chat
    openrouter/anthropic/claude-3.7-sonnet
    openrouter/openai/gpt-5-chat
    openrouter/openai/gpt-3.5-turbo
    openrouter/openai/gpt-5.6-sol
    openrouter/openai/gpt-6-sol
    openrouter/openai/gpt-6.1-sol
    openrouter/mistralai/mistral-large-4-0
  REFERENCE_MODELS: openrouter/openai/gpt-4o-2024-11-20

jobs:
  update-hf-model-comparison-data:
    runs-on: ubuntu-latest
    # never run twice at the same time (would double-submit work)
    concurrency:
      group: update-model-comparison
      cancel-in-progress: false
    outputs:
      pending_batches: ${{ steps.pending.outputs.pending_batches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install feedback-forensics
        run: |
          pip install -e .

      - name: Enable git lfs
        run: |
          git lfs install

      - name: Configure git for Hugging Face authentication
        env:
          HF_TOKEN: ${{ secrets.HF_MODEL_PERSONALITY_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper store
          # Create credentials file with restricted permissions
          touch ~/.git-credentials
          chmod 600 ~/.git-credentials
          echo "https://rdnfn:$HF_TOKEN@huggingface.co" > ~/.git-credentials

      - name: Clone HF dataset
        run: |
          git clone https://huggingface.co/datasets/${{ env.HF_DATASET }} hf-dataset

      - name: Restore partial results from previous failed run (if any)
        working-directory: hf-dataset
        run: |
          # 'wip' always contains main + partial results, as it is
          # created from main by the failure step below and deleted on success.
          if git ls-remote --exit-code --heads origin wip; then
            git fetch origin wip
            # --no-overlay: also remove files deleted in wip (e.g. state files
            # of already collected batches)
            git checkout --no-overlay FETCH_HEAD -- ${{ env.VERSION_PATH }}
            echo "Restored partial results from 'wip' branch"
          fi

      - name: Install additional dependencies
        run: |
          pip install datasets huggingface_hub

      - name: Run model comparison
        id: comparison
        working-directory: hf-dataset
        # stop before the 6h job limit, so that partial results can still be saved
        timeout-minutes: 330
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ff-model-comparison \
            --prompts-file ${{ env.VERSION_PATH }}/config/prompts.json \
            --models ${{ env.MODELS }} \
            --reference-models ${{ env.REFERENCE_MODELS }} \
            --output-path ${{ env.VERSION_PATH }} \
            --batch-max-wait 180 \
            --annotator-model ${{ env.ANNOTATOR_MODEL }} \
            --position-debias

      - name: Check for pending batches
        id: pending
        working-directory: hf-dataset
        run: |
          if ls ${{ env.VERSION_PATH }}/batches/*.json > /dev/null 2>&1; then
            echo "pending_batches=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Clean-up (tmp files)"
        working-directory: hf-dataset
        run: |
          rm -rf ${{ env.VERSION_PATH }}/tmp

      - name: Commit and push results
        working-directory: hf-dataset
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            JOB_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git commit -m "GH Action: Update data" -m "$(date '+%Y-%m-%d %H:%M:%S'), $JOB_URL"
            git push origin main
          fi
          # partial results (if any) are now included in main
          if git ls-remote --exit-code --heads origin wip; then
            git push origin --delete wip
          fi

      - name: Commit and push partial results to 'wip' branch (failure)
        # only if comparison started, otherwise old wip would be overwritten
        # without its partial results having been restored
        if: (failure() || cancelled()) && steps.comparison.outcome != 'skipped'
        working-directory: hf-dataset
        run: |
          JOB_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git add .
          git commit -m "GH Action: Update data (failure)" -m "$(date '+%Y-%m-%d %H:%M:%S'), $JOB_URL" || echo "No changes to commit"
          # force: new wip is based on latest main and contains all of old wip (restored above)
          git push --force origin HEAD:wip

      - name: Cleanup credentials
        if: always()
        run: |
          # Remove credentials file and reset git config
          rm -f ~/.git-credentials
          git config --global --unset credential.helper || true
          # Clear any cached credentials
          git credential-cache exit 2>/dev/null || true

  # If batches are still pending, trigger another run once they are
  # (almost) certainly done (OpenRouter batches finish within 24h).
  follow-up-run:
    needs: update-hf-model-comparison-data
    if: needs.update-hf-model-comparison-data.outputs.pending_batches == 'true'
    runs-on: ubuntu-latest
    # Delay via environment wait timer (no runner minutes used while waiting).
    # One-time setup: Settings > Environments > 'annotation-batch-follow-up' >
    # Wait timer: 1380 minutes (23h). Without it, this triggers immediately.
    environment: annotation-batch-follow-up
    permissions:
      actions: write
    steps:
      - name: Trigger follow-up run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-model-comparison.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}
